<html lang="ru">

<head>
    <meta charset="UTF-8">

    <link
            rel="preload"
            href="fonts/Elastre.ttf"
            as="font"
            type="font/ttf"
            crossorigin
    >

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/southpark.css">
</head>

<body>

<header>
    <a href="index.html" class="city-brand">
        <img
                src="images/gerb.png"
                alt="Герб города Тореза"
                class="city-emblem"
        >

        <span>ТОРЕЗ</span>
    </a>

    <nav>
        <a href="index.html">Главная</a>
        <a href="history.html">История</a>
        <a href="infrastructure.html">Инфраструктура</a>
        <a href="culture.html">Культура</a>
        <a href="developer.html">О разработчике</a>
        <a href="feedback.html">Обратная связь</a>
        <a class="active" href="southpark.html">South Park</a>
    </nav>
</header>


<main>

    <section>

        <h2>South Park</h2>



        <div class="southpark-scene">


            <!-- ЛЕВАЯ ГОРА -->

            <div class="sp-mountain mountain-left">

                <div class="snow snow-1"></div>
                <div class="snow snow-2"></div>
                <div class="snow snow-3"></div>

            </div>


            <!-- ЦЕНТРАЛЬНАЯ ГОРА -->

            <div class="sp-mountain mountain-center">

                <div class="snow snow-1"></div>
                <div class="snow snow-2"></div>
                <div class="snow snow-3"></div>

            </div>


            <!-- ПРАВАЯ ГОРА -->

            <div class="sp-mountain mountain-right">

                <div class="snow snow-1"></div>
                <div class="snow snow-2"></div>
                <div class="snow snow-3"></div>

            </div>


            <!-- СНЕГ НА ЗЕМЛЕ -->

            <div class="snow-ground"></div>


            <!-- ПЕРСОНАЖИ -->

            <div id="wrapper">


                <!-- КАРТМАН -->

                <div id="eric">

                    <div class="face">

                        <div class="hat"></div>

                        <div class="eye-left"></div>
                        <div class="eye-right"></div>

                        <div class="smile"></div>

                    </div>


                    <div class="body">

                        <div class="zipper"></div>

                        <div class="button-1"></div>
                        <div class="button-2"></div>
                        <div class="button-3"></div>

                        <div class="hand-left"></div>
                        <div class="hand-right"></div>

                    </div>


                    <div class="legs">

                        <div class="foot-left"></div>
                        <div class="foot-right"></div>

                    </div>

                </div>


                <!-- КАЙЛ -->

                <div id="kyle">

                    <div class="face">

                        <div class="hat"></div>

                        <div class="eye-left"></div>
                        <div class="eye-right"></div>

                        <div class="smile"></div>

                    </div>


                    <div class="body">

                        <div class="zipper"></div>

                        <div class="button-1"></div>
                        <div class="button-2"></div>
                        <div class="button-3"></div>

                        <!-- Карманы -->
                        <div class="kyle-pocket pocket-left"></div>
                        <div class="kyle-pocket pocket-right"></div>

                        <div class="hand-left"></div>
                        <div class="hand-right"></div>

                    </div>


                    <div class="legs">

                        <div class="foot-left"></div>
                        <div class="foot-right"></div>

                    </div>

                </div>


                <!-- СТЭН -->

                <div id="stan">

                    <div class="face">

                        <div class="hat"></div>

                        <div class="eye-left"></div>
                        <div class="eye-right"></div>

                        <div class="smile"></div>

                    </div>


                    <div class="body">

                        <div class="zipper"></div>

                        <div class="button-1"></div>
                        <div class="button-2"></div>
                        <div class="button-3"></div>

                        <div class="hand-left"></div>
                        <div class="hand-right"></div>

                    </div>


                    <div class="legs">

                        <div class="foot-left"></div>
                        <div class="foot-right"></div>

                    </div>

                </div>


                <!-- КЕННИ -->

                <div id="kenny">

                    <div class="face">

                        <div class="hat"></div>

                        <div class="eye-left"></div>
                        <div class="eye-right"></div>

                        <div class="lace"></div>

                    </div>


                    <div class="body">

                        <div class="zipper"></div>

                        <div class="hand-left"></div>
                        <div class="hand-right"></div>

                    </div>


                    <div class="legs">

                        <div class="foot-left"></div>
                        <div class="foot-right"></div>

                    </div>

                </div>


            </div>

        </div>

    </section>

</main>

</body>

</html>
